  <style id="hus-critical-loading">:root{--shell-font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}*{box-sizing:border-box;margin:0;padding:0}html,body,#app{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#0e1014;color:#dcdcdc;-webkit-font-smoothing:antialiased}.loading-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background-color:#0e1014;background-image:radial-gradient(circle at 50% 44%,rgba(245,148,56,.09) 0%,rgba(219,91,28,.025) 28%,transparent 58%),radial-gradient(ellipse 85% 75% at 50% 45%,#16181d 0%,#0e1014 74%),linear-gradient(rgba(245,243,238,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(245,243,238,.018) 1px,transparent 1px);background-size:100% 100%,100% 100%,48px 48px,48px 48px;background-position:center center;transform:scale(1);opacity:1;will-change:opacity,transform;transition:opacity 320ms cubic-bezier(.22,1,.36,1),transform 320ms cubic-bezier(.22,1,.36,1);font-family:var(--shell-font)}.loading-screen.is-done{opacity:0;transform:scale(1.015);pointer-events:none}.loading-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:min(440px,88vw)}.loading-mark{position:relative;display:grid;place-items:center;width:68px;height:68px;margin-bottom:18px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.48)) drop-shadow(0 0 20px rgba(242,90,46,.22));animation:loading-float 3.4s ease-in-out infinite;will-change:transform}.loading-mark::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(245,148,56,.22) 0%,rgba(219,91,28,.08) 42%,rgba(184,38,11,0) 72%);pointer-events:none}.loading-eyebrow{margin-bottom:10px;color:rgba(244,198,152,.78);font-size:11px;font-weight:600;line-height:1.2;letter-spacing:.24em;text-transform:uppercase;text-align:center;padding-left:.24em}.loading-title{margin:0 0 18px;max-width:min(420px,86vw);color:#f5f3ee;font-size:clamp(1.35rem,2.2vw,1.75rem);font-weight:560;line-height:1.22;letter-spacing:-.02em;text-align:center;text-wrap:balance}.loading-label{display:inline-flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:0;margin-bottom:14px;min-height:20px;color:rgba(226,222,214,.68);font-size:12.5px;font-weight:450;letter-spacing:.015em;text-align:center;font-variant-numeric:tabular-nums}.loading-sep{white-space:pre;color:rgba(245,148,56,.55)}.loading-pct{color:#ffd688;font-weight:560;font-variant-numeric:tabular-nums}.loading-bar{position:relative;width:min(340px,78vw);height:2.5px;border-radius:999px;background:rgba(245,243,238,.085);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.04);overflow:hidden}.loading-bar-fill{position:relative;width:2%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b8260b 0%,#eb7524 48%,#f59438 76%,#ffd688 100%);box-shadow:0 0 12px rgba(245,148,56,.42);transform:translateZ(0);will-change:width;transition:width 160ms cubic-bezier(.22,1,.36,1)}.loading-bar-fill::after{content:"";position:absolute;top:0;right:0;bottom:0;width:36px;background:linear-gradient(90deg,rgba(255,230,148,0) 0%,rgba(255,230,148,.75) 100%);animation:loading-shimmer 1.8s ease-in-out infinite}.loading-screen.is-error .loading-label{color:#ff9b8a}.loading-screen.is-error .loading-mark,.loading-screen.is-error .loading-bar-fill::after{animation:none}@keyframes loading-float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-3.5px,0)}}@keyframes loading-shimmer{0%,100%{opacity:.45}50%{opacity:.95}}</style>
</head>
<body>

        </div>
        <div class="loading-eyebrow">HUS · ARCHITECTURAL TWIN</div>

    </div>
    <script>
      (function () {
        var titles = {
          'stahl-house': 'Stahl House (Case Study #22)',
          'simple-flat': 'Pied-à-terre Apartment',
          'simple-house': 'Georgian Country House'
        };
        var raw = '';
        try {
          raw = (new URLSearchParams(window.location.search).get('house') || '').trim().toLowerCase();
        } catch (_e) {}
        var key = Object.prototype.hasOwnProperty.call(titles, raw) ? raw : 'simple-house';
        var title = titles[key];
        var screenEl = document.getElementById('loading-screen');
        if (screenEl) screenEl.setAttribute('data-preboot-house', key);
        var titleEl = document.getElementById('loading-title');
        if (titleEl) titleEl.textContent = title;
        document.title = title + ' · Hus';
      })();
    </script>
  </div>
  <script type="module" src="/src/main.ts"></script>
